name: Deploy Cartografia do Fomento to GitHub Pages

on:
  push:
    branches:
      - cartografia-do-fomento-import
    paths:
      - 'cartografia-do-fomento/site/**'
      - '.github/workflows/cartografia-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: cartografia-do-fomento/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
